name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Goes to frontend directory
        run: cd ./srcs/frontend

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # If you use @vitest/browser or Playwright-based tests, install a browser:
      - name: Install Playwright (Chromium) + OS deps
        run: npx playwright install --with-deps chromium

      # Run tests with coverage. Ensure Vitest is configured to emit lcov.
      - name: Test
        run: npm test -- --coverage

      - name: Upload coverage artifact (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage/**
            !coverage/**/*.map

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # not needed for public repos
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: true
          verbose: true
